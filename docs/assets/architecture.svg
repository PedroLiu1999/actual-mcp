<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="actual-mcp-arch-title actual-mcp-arch-desc" id="architecture-root">
        <title id="actual-mcp-arch-title">actual-mcp System Architecture</title>
        <desc id="actual-mcp-arch-desc">Topology showing Google Gemini connecting via Cloudflare Tunnel to the actual-mcp container, embedded OAuth server, stateless MCP transport, local SQLite budget cache, and self-hosted Actual Budget server.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #architecture-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #architecture-root { font-family: var(--font-sans); color: var(--color-ink); }
      #architecture-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#architecture-root .diagram-container { overflow-x: visible; }
}</style>
          <marker id="architecture-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="architecture-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="architecture-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <!-- Canvas Background -->
        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Architecture Zone: actual-mcp Docker Container (drawn before arrows and nodes) -->
        <rect x="392" y="64" width="336" height="432" rx="8"
              fill="#2d3142" stroke="#2d3142" stroke-width="0.8" fill-opacity="0.02" stroke-opacity="0.12"/>
        <rect x="444" y="68" width="232" height="14" rx="2" fill="#f5f5f5"/>
        <text x="560" y="78" fill="#5a6580" font-size="7.5" font-family="'Geist Mono', monospace"
              text-anchor="middle" letter-spacing="0.14em">CONTAINER BOUNDARY · ACTUAL-MCP</text>

        <!-- Connectors (drawn before nodes) -->
        <!-- Gemini -> Cloudflare Tunnel -->
        <line x1="184" y1="240" x2="224" y2="240" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#architecture-arrow-link)"/>

        <!-- Cloudflare Tunnel -> Embedded OAuth Server (Auth branch) -->
        <path d="M 352,224 H 380 Q 388,224 388,216 V 144 Q 388,136 396,136 H 432"
              fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#architecture-arrow-link)"/>

        <!-- Cloudflare Tunnel -> Stateless MCP Transport (Primary MCP flow) -->
        <line x1="352" y1="256" x2="432" y2="256" stroke="#bf4520" stroke-width="1.4" marker-end="url(#architecture-arrow-accent)"/>

        <!-- Embedded OAuth Server -> Stateless MCP Transport (Token check) -->
        <line x1="560" y1="168" x2="560" y2="208" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#architecture-arrow)"/>

        <!-- Stateless MCP Transport -> ActualBudgetGateway (Mutex serialized tools) -->
        <line x1="560" y1="272" x2="560" y2="312" stroke="#bf4520" stroke-width="1.4" marker-end="url(#architecture-arrow-accent)"/>

        <!-- ActualBudgetGateway -> SQLite Budget Cache (Local read/write) -->
        <line x1="560" y1="376" x2="560" y2="416" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#architecture-arrow)"/>

        <!-- ActualBudgetGateway -> Actual Budget Sync Server (Upstream HTTP sync) -->
        <line x1="688" y1="344" x2="768" y2="344" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#architecture-arrow)"/>

        <!-- Connector Labels (with opaque mask rects and >=6-10px gaps) -->
        <!-- Gemini -> Cloudflare Tunnel: HTTPS -->
        <rect x="188" y="222" width="32" height="12" rx="2" fill="#f5f5f5"/>
        <text x="204" y="231" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">HTTPS</text>

        <!-- Cloudflare Tunnel -> OAuth: OAUTH -->
        <rect x="332" y="166" width="48" height="12" rx="2" fill="#f5f5f5"/>
        <text x="356" y="175" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">OAUTH</text>

        <!-- Cloudflare Tunnel -> MCP: POST /mcp -->
        <rect x="364" y="238" width="56" height="12" rx="2" fill="#f5f5f5"/>
        <text x="392" y="247" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">POST /MCP</text>

        <!-- OAuth -> MCP: BEARER TOKEN -->
        <rect x="572" y="182" width="76" height="12" rx="2" fill="#f5f5f5"/>
        <text x="610" y="191" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">BEARER TOKEN</text>

        <!-- MCP -> Gateway: FIFO MUTEX -->
        <rect x="572" y="286" width="68" height="12" rx="2" fill="#f5f5f5"/>
        <text x="606" y="295" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">FIFO MUTEX</text>

        <!-- Gateway -> SQLite: LOCAL SYNC -->
        <rect x="572" y="390" width="68" height="12" rx="2" fill="#f5f5f5"/>
        <text x="606" y="399" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LOCAL SYNC</text>

        <!-- Gateway -> Upstream: HTTP SYNC -->
        <rect x="702" y="326" width="52" height="12" rx="2" fill="#f5f5f5"/>
        <text x="728" y="335" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PORT 5006</text>

        <!-- Nodes -->
        <!-- Node 1: Google Gemini (External Client) -->
        <rect x="48" y="204" width="136" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="48" y="204" width="136" height="72" rx="6" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.30"/>
        <rect x="56" y="212" width="32" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.25"/>
        <text x="72" y="221" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CLIENT</text>
        <text x="116" y="240" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Google Gemini</text>
        <text x="116" y="258" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Custom MCP Connector</text>

        <!-- Node 2: Cloudflare Tunnel (Ingress) -->
        <rect x="224" y="204" width="128" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="224" y="204" width="128" height="72" rx="6" fill="#4f5d75" stroke="#5a6580" stroke-width="1" fill-opacity="0.08"/>
        <rect x="232" y="212" width="36" height="12" rx="2" fill="none" stroke="#5a6580" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="250" y="221" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TUNNEL</text>
        <text x="288" y="240" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Cloudflare Tunnel</text>
        <text x="288" y="258" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">cloudflared (HTTPS)</text>

        <!-- Node 3: Embedded OAuth Server -->
        <rect x="432" y="104" width="256" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="432" y="104" width="256" height="64" rx="6" fill="#2d3142" stroke="#4f5d75" stroke-width="1" fill-opacity="0.04"/>
        <rect x="440" y="112" width="32" height="12" rx="2" fill="none" stroke="#4f5d75" stroke-width="0.8" stroke-opacity="0.50"/>
        <text x="456" y="121" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">AUTH</text>
        <text x="560" y="134" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Embedded OAuth 2.1 Server</text>
        <text x="560" y="152" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">PKCE · Consent Screen · Token Store</text>

        <!-- Node 4: Stateless MCP Transport (FOCAL ACCENT) -->
        <rect x="432" y="208" width="256" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="432" y="208" width="256" height="64" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1.2" fill-opacity="0.08"/>
        <rect x="440" y="216" width="28" height="12" rx="2" fill="none" stroke="#bf4520" stroke-width="0.8" stroke-opacity="0.50"/>
        <text x="454" y="225" fill="#bf4520" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MCP</text>
        <text x="560" y="238" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Streamable HTTP Transport</text>
        <text x="560" y="256" fill="#bf4520" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">30 Tools · Decimal Conversion · /mcp</text>

        <!-- Node 5: ActualBudgetGateway -->
        <rect x="432" y="312" width="256" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="432" y="312" width="256" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="440" y="320" width="36" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.30"/>
        <text x="458" y="329" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SYNC</text>
        <text x="560" y="342" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">ActualBudgetGateway</text>
        <text x="560" y="360" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">FIFO Mutex · Coalesced Sync (TTL 30s)</text>

        <!-- Node 6: SQLite Budget Cache -->
        <rect x="432" y="416" width="256" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="432" y="416" width="256" height="64" rx="6" fill="#2d3142" stroke="#4f5d75" stroke-width="1" fill-opacity="0.05"/>
        <rect x="440" y="424" width="36" height="12" rx="2" fill="none" stroke="#4f5d75" stroke-width="0.8" stroke-opacity="0.50"/>
        <text x="458" y="433" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STORE</text>
        <text x="560" y="446" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">SQLite Budget Cache</text>
        <text x="560" y="464" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">better-sqlite3 · /data/budget-cache</text>

        <!-- Node 7: Actual Budget Sync Server (Upstream) -->
        <rect x="768" y="312" width="152" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="768" y="312" width="152" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="776" y="320" width="36" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.30"/>
        <text x="794" y="329" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SERVER</text>
        <text x="844" y="342" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Actual Server</text>
        <text x="844" y="360" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">actualbudget/actual-server</text>

        <!-- Legend Strip -->
        <line x1="48" y1="524" x2="912" y2="524" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.12"/>
        <text x="48" y="542" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

        <!-- Legend Items -->
        <rect x="48" y="556" width="14" height="10" rx="2" fill="#bf4520" stroke="#bf4520" stroke-width="1.2" fill-opacity="0.08"/>
        <text x="68" y="565" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Focal / MCP Transport</text>

        <rect x="204" y="556" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="224" y="565" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Backend / Engine</text>

        <rect x="336" y="556" width="14" height="10" rx="2" fill="#2d3142" stroke="#4f5d75" stroke-width="1" fill-opacity="0.05"/>
        <text x="356" y="565" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Store / Auth</text>

        <rect x="444" y="556" width="14" height="10" rx="2" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.30"/>
        <text x="464" y="565" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">External / Ingress</text>

        <line x1="580" y1="561" x2="608" y2="561" stroke="#bf4520" stroke-width="1.4" marker-end="url(#architecture-arrow-accent)"/>
        <text x="616" y="565" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Primary MCP Flow</text>

        <line x1="724" y1="561" x2="752" y2="561" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#architecture-arrow-link)"/>
        <text x="760" y="565" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">HTTPS / OAuth</text>

        <line x1="850" y1="561" x2="878" y2="561" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#architecture-arrow)"/>
        <text x="886" y="565" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Internal</text>
      </svg>
